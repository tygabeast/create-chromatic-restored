plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Create is only needed at runtime: the mod looks its items up by ID, so there is no compile-time dependency.
// To test in the dev client, add Create (and its own dependencies) to the run, e.g. via a runtimeOnly
// dependency from https://maven.createmod.net, or drop the Create jar into run/mods.

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
